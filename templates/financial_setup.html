<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Setup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
            padding: 30px 15px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 { text-align: center; color: #26345c; }
        p { color: #666; text-align: center; }
        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
            color: #333;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }
        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #344b8e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #26345c; }
        .section-title {
            margin-top: 28px;
            color: #344b8e;
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Financial Setup</h1>
        <p>Welcome, {{ full_name }}! Set your expected monthly income and spending limits.</p>

        <form method="POST">
            <label for="expected_income">Expected Monthly Income (₹)</label>
            <input
                type="number"
                id="expected_income"
                name="expected_income"
                min="0.01"
                step="0.01"
                placeholder="Example: 25000"
                required
            >

            <h3 class="section-title">Expected Monthly Expense Budgets</h3>
            <p>Enter the maximum amount you plan to spend in each category.</p>

            {% for category in categories %}
                <label for="budget_{{ category.category_id }}">
                    {{ category.category_name }} (₹)
                </label>
                <input
                    type="number"
                    id="budget_{{ category.category_id }}"
                    name="budget_{{ category.category_id }}"
                    min="0"
                    step="0.01"
                    placeholder="Enter expected amount"
                >
            {% endfor %}

            <button type="submit">Save Financial Setup</button>
        </form>
    </div>
</body>
</html>
