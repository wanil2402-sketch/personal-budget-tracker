<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Expense Tracker</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
        }
        input {
            font-size: 16px;
            min-height: 48px;
        }
        button {
            font-size: 17px;
            min-height: 48px;
        }
        @media (max-width: 600px) {
            body {
                padding: 24px 16px;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .container {
                width: 100%;
                max-width: 420px;
                padding: 30px 20px;
            }
            h1 {
                font-size: 27px;
            }
            input {
                width: 100%;
                padding: 14px;
                margin: 10px 0;
            }
            button {
                width: 100%;
                min-height: 52px;
            }
            p {
                font-size: 16px;
            }
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            text-align: center;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            margin: auto;
        }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            background: #34495e;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome Back!</h1>
        <form action="/login" method="POST" id="loginForm">
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="password" name="password" placeholder="Password" required>
            <br><br>
            <button type="submit" id="loginButton">Login</button>
        </form>
        <p><a href="/forgot-password">Forgot Password?</a></p>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function () {
            const button = document.getElementById("loginButton");
            button.disabled = true;
            button.textContent = "Logging in...";
        });
    </script>
</body>
</html>
