<!DOCTYPE html>
<html>
<head>
    <title>Verify Login</title>
</head>
<body style="font-family: Arial; background:#f4f6fb; text-align:center; padding:50px;">
    <div style="background:white; padding:30px; border-radius:15px; max-width:400px; margin:auto;">
        <h2>Two-Factor Verification</h2>
        <p>Enter the 6-digit verification code sent to your registered email address.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="otp" placeholder="Enter 6-digit OTP"
                   maxlength="6" pattern="[0-9]{6}" inputmode="numeric" required
                   style="width:90%; padding:12px; margin:10px 0;">
            <br><br>
            <button type="submit" style="padding:12px 25px;">Verify OTP</button>
        </form>
    </div>
</body>
</html>
