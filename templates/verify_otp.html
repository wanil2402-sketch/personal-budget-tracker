<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Login</title>
    <style>
        * {
            box-sizing: border-box;
        }
        input {
            font-size: 18px;
            min-height: 50px;
            text-align: center;
            letter-spacing: 5px;
            max-width: 100%;
        }
        button {
            font-size: 17px;
            min-height: 50px;
            cursor: pointer;
        }
        @media (max-width: 600px) {
            body {
                margin: 0;
                padding: 24px 16px !important;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            body > div {
                width: 100%;
                max-width: 420px !important;
                padding: 28px 20px !important;
            }
            h2 {
                font-size: 25px;
            }
            p {
                font-size: 16px;
                line-height: 1.5;
            }
            input, button {
                width: 100% !important;
            }
        }
    </style>
</head>
<body style="font-family: Arial; background:#f4f6fb; text-align:center; padding:50px;">
    <div style="background:white; padding:30px; border-radius:15px; max-width:400px; margin:auto;">
        <h2>Two-Factor Verification</h2>
        <p>Enter the 6-digit verification code sent to your registered email address.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="otp" placeholder="Enter 6-digit OTP"
                   maxlength="6" pattern="[0-9]{6}" inputmode="numeric" required
                   style="width:90%; padding:12px; margin:10px 0;">
            <br><br>
            <button type="submit" style="padding:12px 25px;">Verify OTP</button>
        </form>
    </div>
</body>
</html>
