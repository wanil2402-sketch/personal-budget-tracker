<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            text-align: center;
            padding: 80px;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            max-width: 500px;
            margin: auto;
        }
        h1 {
            color: #34495e;
        }
        p {
            color: #666;
        }
        button {
            background: #34495e;
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        @media (max-width: 600px) {
            body {
                padding: 24px 16px;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .container {
                width: 100%;
                padding: 32px 22px;
            }

            h1 {
                font-size: 27px;
                line-height: 1.3;
            }

            h2 {
                font-size: 23px;
            }

            p {
                font-size: 17px;
                line-height: 1.5;
            }

            button {
                width: 100%;
                min-height: 52px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Personal Expense Tracker</h1>
        <h2>Welcome!</h2>
        <p>Manage your income and expenses in one place.</p>
        <a href="/register"><button type="button">Get Started</button></a>
    </div>
</body>
</html>
