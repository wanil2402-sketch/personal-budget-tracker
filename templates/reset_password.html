<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
</head>
<body style="font-family: Arial; background:#f4f6fb; text-align:center; padding:50px;">
    <div style="background:white; padding:30px; border-radius:15px; max-width:400px; margin:auto;">
        <h2>Reset Your Password</h2>
        <form method="POST">
            <input type="password" name="password" placeholder="New Password" required minlength="8"
                   style="width:90%; padding:12px; margin:10px 0;">
            <input type="password" name="confirm_password" placeholder="Confirm New Password" required minlength="8"
                   style="width:90%; padding:12px; margin:10px 0;">
            <br><br>
            <button type="submit" style="padding:12px 25px;">Update Password</button>
        </form>
    </div>
</body>
</html>
