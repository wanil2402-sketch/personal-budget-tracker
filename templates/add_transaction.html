<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Transaction - Expense Tracker</title>
    <style>
        * {
            box-sizing: border-box;
        }
        input, select {
            font-size: 16px;
            min-height: 48px;
        }
        button {
            font-size: 17px;
            min-height: 50px;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            text-align: center;
            padding: 40px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 450px;
            margin: auto;
        }
        input, select {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            background: #34495e;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        @media (max-width: 600px) {
            body {
                margin: 0;
                padding: 24px 16px;
            }
            .container {
                width: 100%;
                padding: 28px 20px;
            }
            h1 {
                font-size: 26px;
            }
            input, select, button {
                width: 100%;
            }
            input, select {
                padding: 14px;
                margin: 10px 0;
            }
            button {
                padding: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Add Transaction</h1>

        <form action="/add-transaction" method="POST">

            <select name="category_id" required>
                <option value="">Select Category</option>
                {% for category in categories %}
                <option value="{{ category.category_id }}">
                    {{ category.category_name }} ({{ category.category_type }})
                </option>
                {% endfor %}
            </select>

            <input type="number" name="amount"
                   placeholder="Amount (₹)" min="0.01"
                   step="0.01" required>

            <select name="method_id" required>
                <option value="">Select Payment Method</option>
                {% for method in methods %}
                <option value="{{ method.method_id }}">
                    {{ method.method_name }}
                </option>
                {% endfor %}
            </select>

            <input type="date" name="transaction_date" required>

            <input type="text" name="description"
                   placeholder="Description">

            <br><br>
            <button type="submit">Save Transaction</button>
        </form>
    </div>
</body>
</html>
