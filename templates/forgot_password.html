<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        * {
            box-sizing: border-box;
        }
        input, button {
            font-size: 16px;
            min-height: 50px;
        }
        button {
            cursor: pointer;
        }
        @media (max-width: 600px) {
            body {
                margin: 0;
                padding: 24px 16px !important;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            body > div {
                width: 100%;
                max-width: 420px !important;
                padding: 28px 20px !important;
            }
            h2 {
                font-size: 25px;
            }
            p {
                font-size: 16px;
                line-height: 1.5;
            }
            input, button {
                width: 100% !important;
            }
        }
    </style>
</head>
<body style="font-family: Arial; background:#f4f6fb; text-align:center; padding:50px;">
    <div style="background:white; padding:30px; border-radius:15px; max-width:400px; margin:auto;">
        <h2>Forgot Password?</h2>
        <p>Enter your registered email address. We'll send you a password reset link if the account exists.</p>
        <form method="POST">
            <input type="email" name="email" placeholder="Email Address" required
                   style="width:90%; padding:12px; margin:10px 0;">
            <br><br>
            <button type="submit" style="padding:12px 25px;">Send Reset Link</button>
        </form>
        <p><a href="/login">Back to Login</a></p>
    </div>
</body>
</html>
