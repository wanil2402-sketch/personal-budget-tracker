<!DOCTYPE html>
<html>
<head>
    <title>Monthly Budget</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            text-align: center;
            padding: 40px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 450px;
            margin: auto;
        }
        input, select {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            background: #34495e;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Set Monthly Budget</h1>

        <form action="/budget" method="POST">
            <select name="category_id" required>
                <option value="">Select Expense Category</option>
                {% for category in categories %}
                <option value="{{ category.category_id }}">
                    {{ category.category_name }}
                </option>
                {% endfor %}
            </select>

            <input type="number" name="budget_amount"
                   placeholder="Budget Amount (₹)"
                   min="0.01" step="0.01" required>

            <input type="number" name="budget_month"
                   placeholder="Month (1-12)"
                   min="1" max="12" required>

            <input type="number" name="budget_year"
                   placeholder="Year"
                   min="2020" required>

            <br><br>
            <button type="submit">Save Budget</button>
        </form>
    </div>
</body>
</html>
