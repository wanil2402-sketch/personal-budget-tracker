<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Transaction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            padding: 30px;
        }
        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }
        h1 {
            text-align: center;
            color: #344b8e;
        }
        label {
            display: block;
            margin-top: 16px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #344b8e;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }
        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #344b8e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Edit Transaction</h1>

        <form method="POST">
            <label>Category</label>
            <select name="category_id" required>
                {% for category in categories %}
                <option value="{{ category.category_id }}"
                    {% if category.category_id == transaction.category_id %}selected{% endif %}>
                    {{ category.category_name }} ({{ category.category_type }})
                </option>
                {% endfor %}
            </select>

            <label>Amount (₹)</label>
            <input type="number" name="amount" step="0.01" min="0.01"
                   value="{{ transaction.amount }}" required>

            <label>Payment Method</label>
            <select name="method_id" required>
                {% for method in methods %}
                <option value="{{ method.method_id }}"
                    {% if method.method_id == transaction.method_id %}selected{% endif %}>
                    {{ method.method_name }}
                </option>
                {% endfor %}
            </select>

            <label>Date</label>
            <input type="date" name="transaction_date"
                   value="{{ transaction.transaction_date }}" required>

            <label>Description</label>
            <input type="text" name="description"
                   value="{{ transaction.description or '' }}">

            <button type="submit">Save Changes</button>
        </form>

        <a class="back" href="{{ url_for('transactions') }}">Back to Transactions</a>
    </div>
</body>
</html>
